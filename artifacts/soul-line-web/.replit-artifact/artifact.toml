kind = "web"
previewPath = "/"
title = "Soul · Line Trainer"
version = "1.0.0"
id = "artifacts/soul-line-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23262

[services.development]
run = "pnpm --filter @workspace/soul-line-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soul-line-web", "run", "build" ]
publicDir = "artifacts/soul-line-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23262"
BASE_PATH = "/"
