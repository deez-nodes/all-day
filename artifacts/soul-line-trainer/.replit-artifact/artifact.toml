kind = "mobile"
previewPath = "/"
title = "Soul · Line Trainer"
version = "1.0.0"
id = "artifacts/soul-line-trainer"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20307

[services.development]
run = "pnpm --filter @workspace/soul-line-trainer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soul-line-trainer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/soul-line-trainer", "run", "serve" ]

[services.env]
PORT = "20307"
BASE_PATH = "/"
